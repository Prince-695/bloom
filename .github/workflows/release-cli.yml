name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: linux-x64
            artifact: bloom-linux-x64
          - runner: ubuntu-24.04-arm
            asset: linux-arm64
            artifact: bloom-linux-arm64
          - runner: macos-13
            asset: darwin-x64
            artifact: bloom-darwin-x64
          - runner: macos-latest
            asset: darwin-arm64
            artifact: bloom-darwin-arm64
          - runner: windows-latest
            asset: windows-x64
            artifact: bloom-windows-x64.exe
          - runner: windows-11-arm
            asset: windows-arm64
            artifact: bloom-windows-arm64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI binary
        shell: bash
        run: bash scripts/build-cli-release.sh ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bloom-${{ matrix.asset }}
          path: |
            packages/cli/dist-release/${{ matrix.artifact }}
            packages/cli/dist-release/SHA256SUMS-${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Merge checksums
        run: |
          cd release-assets
          cat SHA256SUMS-* > SHA256SUMS
          ls -lh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

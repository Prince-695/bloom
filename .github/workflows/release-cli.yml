name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: linux-x64
          - runner: ubuntu-24.04-arm
            asset: linux-arm64
          # Apple Silicon only (Intel macOS runners queue forever)
          - runner: macos-latest
            asset: darwin-arm64
          - runner: windows-latest
            asset: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          CI: "true"
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bloom

      - name: Build CLI binary
        shell: bash
        run: bash scripts/build-cli-release.sh ${{ matrix.asset }}
        env:
          CI: "true"
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bloom
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bloom-${{ matrix.asset }}
          path: |
            packages/cli/dist-release/bloom-*
            packages/cli/dist-release/SHA256SUMS-*
            packages/cli/dist-release/ARTIFACT_NAME
            packages/cli/dist-release/VERSION
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Merge checksums
        run: |
          cd release-assets
          cat SHA256SUMS-* > SHA256SUMS
          # Drop helper files from the published release
          rm -f ARTIFACT_NAME VERSION
          ls -lh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
